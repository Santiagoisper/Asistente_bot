name: DB Check

on:
  pull_request:
    branches: [main, claude/**]
    paths:
      - 'ichtys/packages/db/**'
      - '.github/workflows/db-check.yml'

jobs:
  db-check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ichtys
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DATABASE_URL_UNPOOLED: ${{ secrets.DATABASE_URL_UNPOOLED }}
    steps:
      # `secrets` no está permitido en un `if:` a nivel job: el chequeo va en un step.
      - id: guard
        working-directory: .
        run: |
          if [ -z "$DATABASE_URL" ] || [ -z "$DATABASE_URL_UNPOOLED" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::notice::DB Check omitido: faltan los secrets DATABASE_URL / DATABASE_URL_UNPOOLED."
          fi
      - if: steps.guard.outputs.skip != 'true'
        uses: actions/checkout@v7
      - if: steps.guard.outputs.skip != 'true'
        uses: pnpm/action-setup@v6
        with:
          version: 9
      - if: steps.guard.outputs.skip != 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
          cache-dependency-path: ichtys/pnpm-lock.yaml
      - if: steps.guard.outputs.skip != 'true'
        run: pnpm install --frozen-lockfile
      - if: steps.guard.outputs.skip != 'true'
        run: pnpm db:check
