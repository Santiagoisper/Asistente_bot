name: recover-stuck-docs

# Plan Vercel Hobby: los crons nativos corren máx 1 vez/día, así que la
# frecuencia horaria la maneja GitHub Actions pegándole al endpoint.
on:
  schedule:
    - cron: '0 * * * *' # cada hora (GitHub puede demorar el disparo bajo carga)
  workflow_dispatch: {} # permite dispararlo a mano desde la pestaña Actions

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Call recovery endpoint
        run: |
          curl -fsS -X GET \
            "https://asistente-bot-five.vercel.app/api/cron/recover-stuck-docs" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}"
