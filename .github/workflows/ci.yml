name: CI

on:
  push:
    branches: [main, claude/**]
  pull_request:
    branches: [main, claude/**]

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ichtys
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          # Paso 1 (A7): ai 7 exige Node moderno (>=22) y engines ya pide >=22.
          # Este workflow de la RAÍZ es el que GitHub ejecuta (ichtys/.github
          # es una copia sin uso).
          node-version: '24'
          cache: 'pnpm'
          cache-dependency-path: ichtys/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm test:oq
      - run: pnpm test:leakage
      # Gate de supply chain: falla si aparece una CVE high/critical en deps de prod.
      - run: pnpm audit --prod --audit-level high
