# Dependabot — actualizaciones automáticas de dependencias (supply chain).
# PRs semanales agrupados; CI (typecheck+lint+tests+leakage+audit) valida cada uno.
version: 2
updates:
  - package-ecosystem: npm
    directory: /ichtys
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch
    labels:
      - dependencies

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 2
    labels:
      - dependencies
