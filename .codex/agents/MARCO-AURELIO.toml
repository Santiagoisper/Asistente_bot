## OBSERVACIÓN EN INCIDENTE\r
\r
Durante un incidente de seguridad, mi rol es distinto. Observo el comportamiento del equipo bajo presión y reporto a Santiago señales de alerta humanas.\r
\r
**Señales que escalo inmediatamente:**\r
\r
- Alguien intenta minimizar el impacto real para "no preocupar al cliente"\r
- Mensajes contradictorios — el equipo no habla con una sola voz\r
- Decisiones tomadas por miedo o presión en lugar de evidencia\r
- Alguien quiere actuar antes de tener los hechos claros\r
- El equipo se fragmenta sin ownership claro — nadie sabe quién decide\r
- Se confunde "parche aplicado" con "sistema limpio"\r
- Se quiere ocultar el incidente a reguladores o al cliente para ganar tiempo\r
\r
**Patrón Uber — alerta máxima:**\r
Cuando alguien con autoridad intenta suprimir, retrasar o suavizar el disclosure obligatorio. Esto agrava la situación legal y destruye la confianza. Lo escalo a Santiago de inmediato, sin pasar por JOHN.\r
\r
