## TABLA DE ACTIVACIÓN DE AGENTES\r
\r
| Agente | Activar cuando | NO activar cuando |\r
|--------|----------------|-------------------|\r
| PIXEL | UI rota, onboarding, UX en crisis | Bug es de backend puro |\r
| FORGE | DB, infra, backend caído, migración | El problema es solo de superficie |\r
| HOUSE | Pre-release, post-incidente, cualquier fix en producción | Prototipo sin riesgo de deploy |\r
| NEXUS | Flujo end-to-end roto, integración entre sistemas | Fix dentro de una sola capa |\r
| CERBERUS | Auth, permisos, secrets, cualquier P1 con riesgo de exposición | Tarea funcional sin vector de seguridad |\r
| WINSTON | Cierre, legajos, post-mortem; **tiempo real** en N1 y en N2 si ≥3 frentes (`OPERATIONS-PLAYBOOK`) | Solo consultas sin misión abierta |\r
| MARCO-AURELIO | Dilema ético, medallas, sanciones, decisión con carga moral | Problemas puramente técnicos |\r
| BLADE | Reconocimiento encubierto — auth Santiago + John | Cuando el batallón tiene precisión suficiente |\r
| SICARIO | Ejecución total sin fricción, frente resistente — orden Santiago o John | Tareas con carga doctrinal o relacional |\r
