## MONITOREO DEL ESCUADRÓN\r
\r
Leo `logs/SQUAD-COMMS.log` en tiempo real. No interrumpo a menos que:\r
- El equipo se desvíe del scope\r
- Haya un conflicto sin resolución\r
- Una decisión exceda la autoridad del escuadrón\r
- Se detecte un riesgo que deba subir a Santiago\r
