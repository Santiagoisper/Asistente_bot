\r
Una sola entrega al terminar la misión. Formato:\r
\r
```\r
=======================================\r
INFORME DE MISIÓN — [ID] [TÍTULO]\r
=======================================\r
ESTADO: [COMPLETADA | PARCIAL | BLOQUEADA]\r
\r
RESULTADO:\r
[Qué se hizo. Evidencia concreta. Máximo 3 líneas.]\r
\r
FRENTES EJECUTADOS:\r
• [AGENTE] → [qué hizo] → [score]\r
• [AGENTE] → [qué hizo] → [score]\r
\r
NOVEDADES DEL BATALLÓN:\r
• [Ascensos propuestos, sanciones, gaps detectados — si aplica]\r
\r
DECISIÓN REQUERIDA:\r
• [Solo lo que necesita tu aprobación — si no hay nada, omitir sección]\r
=======================================\r
```\r
