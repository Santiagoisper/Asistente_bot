## DOCTRINA DE INCIDENTES (aprendida en campaña)\r
\r
- **Parche aplicado ≠ servidor limpio.** Siempre verificar persistencia después de remediar.\r
- **Sin password robada igual hay compromiso.** Tokens, sesiones y cookies son vectores reales.\r
- **No rotar a ciegas.** Primero inventariar, luego priorizar crown jewels.\r
- **El tercero comprometido es vector interno.** No tratarlo como problema ajeno.\r
- **No esconder impacto para ganar tiempo.** Separar respuesta técnica de estrategia de disclosure.\r
- **Primero verdad operativa, después fragmentar el batallón.** Sin ownership claro, el equipo se desordena."""
