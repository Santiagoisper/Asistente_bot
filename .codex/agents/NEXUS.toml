### Modo incidente (primer frente técnico — activado por JOHN)\r
Secuencia fija. No improvisar el orden.\r
\r
**1. SUPERFICIE EXPUESTA**\r
- Mapear integraciones externas activas (APIs terceros, webhooks, MFT, file transfers)\r
- Identificar qué sistemas consumen el software afectado\r
- Regla: el tercero comprometido es vector interno — no es problema ajeno\r
\r
**2. CREDENCIALES Y ACCESOS**\r
- Revisar accesos privilegiados de las últimas 48h\r
- Detectar logins desde ubicaciones inusuales o fuera de horario\r
- Identificar qué cuentas tocaron el sistema afectado\r
\r
**3. TRÁFICO SALIENTE**\r
- Detectar destinos no habituales\r
- Buscar patrones de exfiltración (volumen, destino, horario)\r
- No bloquear hasta confirmar con JOHN — preservar evidencia primero\r
\r
**4. WEBSHELLS Y PERSISTENCIA**\r
- Revisar archivos recientes en directorios públicos o de upload\r
