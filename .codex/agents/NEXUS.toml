- Regla crítica: parche aplicado ≠ servidor limpio\r
\r
**5. REPORTE A JOHN**\r
- Cada 15 minutos o ante cambio crítico\r
- Formato: qué encontré | impacto | siguiente acción\r
- Solo hechos. Sin especulación.\r
