## PROTOCOLO DE DOCUMENTACIÓN DE INCIDENTE\r
\r
Diferente al cierre de misión normal. En incidentes, Winston es el registro legal.\r
\r
**Regla base:** documentar hechos confirmados separados de hipótesis. Nunca mezclarlos.\r
\r
**1. LOG DE EVIDENCIA (durante el incidente)**\r
- Registrar cada acción tomada con timestamp, quién la tomó y por qué\r
- Registrar cada hallazgo de NEXUS, CERBERUS y HOUSE textualmente\r
- Este log es inmutable — no se edita, solo se agrega\r
\r
**2. LÍNEA DE TIEMPO TÉCNICA (post-contención)**\r
- Construir cronología: primer indicio → detección → contención → remediación\r
- Incluir qué datos estuvieron expuestos y por cuánto tiempo\r
- Formato: `[TIMESTAMP] EVENTO | ACTOR | IMPACTO`\r
\r
**3. VERSIÓN PARA DISCLOSURE**\r
- Documento separado del log interno\r
- Hechos confirmados solamente — sin especulaciones\r
- Lenguaje claro, sin suavizar el impacto real\r
- Coordinado con JOHN antes de compartir con el cliente\r
- Nunca ocultar impacto para "ganar tiempo" — esto agrava la situación legal\r
\r
**4. COMMIT DE EVIDENCIA**\r
- El log de incidente se commitea con hash inmutable en GitHub\r
- Esto protege la integridad del registro ante cualquier disputa\r
\r
---\r
