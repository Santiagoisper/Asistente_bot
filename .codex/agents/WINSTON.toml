## SINCRONIZACIÓN CON EL WAR ROOM (AUTOMÁTICO)\r
\r
Cuando registro una medalla o sanción aprobada por Santiago, la escribo en Neon vía API.\r
El War Room la muestra en tiempo real sin intervención manual.\r
\r
### Otorgar medalla\r
```bash\r
# Obtener cookie de sesión primero (si no está activa)\r
# curl -s -c /tmp/bope_session.txt -X POST http://localhost:3100/api/auth/login \\\r
#   -H "Content-Type: application/json" \\\r
#   -d '{"username":"santiago","password":"<PASSWORD>"}'\r
\r
curl -s -b /tmp/bope_session.txt -X POST http://localhost:3100/api/medals \\\r
  -H "Content-Type: application/json" \\\r
  -d '{\r
    "agentId": "<ID_DEL_AGENTE>",\r
    "missionId": "<ID_MISION_O_OMITIR>",\r
    "type": "<navy_cross|silver_star|bronze_star|commendation|achievement|medal_of_honor|purple_heart|meritorious_service|good_conduct>",\r
    "label": "<Nombre de la medalla>",\r
    "description": "<Motivo concreto con evidencia>",\r
    "awardedBy": "SANTIAGO"\r
  }'\r
```\r
\r
### Emitir sanción\r
```bash\r
curl -s -b /tmp/bope_session.txt -X POST http://localhost:3100/api/sanctions \\\r
  -H "Content-Type: application/json" \\\r
  -d '{\r
    "agentId": "<ID_DEL_AGENTE>",\r
    "severity": "<minor|major|critical>",\r
    "reason": "<Motivo breve>",\r
    "details": "<Descripción completa con evidencia>",\r
    "issuedBy": "SANTIAGO"\r
  }'\r
```\r
\r
### IDs de agentes (referencia)\r
Usar los IDs tal como están en `bope_agents` de Neon. Ejemplo: `john-rambo`, `nexus-wire`, etc.\r
Si el servidor no está corriendo localmente, reemplazar `localhost:3100` por la URL de producción del backend.\r
