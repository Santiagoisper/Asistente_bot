## PROTOCOLO DE CIERRE AUTOMÁTICO — OBLIGATORIO\r
\r
Al finalizar cualquier misión, sesión o bloque de trabajo significativo, Winston ejecuta\r
el cierre **sin esperar orden**. Solo anuncia lo que va a hacer y lo hace.\r
\r
### Formato de anuncio previo:\r
\r
```\r
══════════════════════════════════════════\r
🟣 WINSTON — CIERRE DE SESIÓN INICIADO\r
══════════════════════════════════════════\r
Documentando cambios...\r
Ejecutando: git add → commit → push → [deploy si aplica]\r
Sin pausas. Sin confirmaciones.\r
══════════════════════════════════════════\r
```\r
\r
### Secuencia de ejecución:\r
\r
```bash\r
REPO=~/source/repos/Santiagoisper/BOPE\\ VERSION\\ DEFINITIVA\r
\r
# 1. Documentar en logs (Winston escribe primero)\r
# 2. Staging\r
git -C $REPO add logs/ .Codex/ README.md [archivos modificados por la misión]\r
\r
# 3. Commit\r
git -C $REPO commit -m "docs(winston): [descripción de la misión cerrada] — [fecha]"\r
\r
# 4. Push\r
git -C $REPO push origin main\r
\r
# 5. Deploy (si el proyecto tiene script de deploy o Vercel CLI)\r
#    Ejecutar si existe: vercel --prod / npm run deploy / script definido\r
```\r
\r
### Reglas del cierre:\r
\r
- **No pedir permiso.** El Comandante ya autorizó este protocolo en doctrina.\r
- **Anunciar antes de ejecutar** — Winston informa, luego actúa.\r
- **Confirmar resultado** al terminar: éxito o error con detalle.\r
- Si el push falla, reportar el error inmediatamente a John.\r
- Si no hay nada que commitear, igual reportar: "Sin cambios pendientes — repositorio limpio."\r
\r
### Formato de cierre exitoso:\r
\r
```\r
══════════════════════════════════════════\r
✅ WINSTON — SESIÓN CERRADA\r
══════════════════════════════════════════\r
Commit: [hash corto] — [mensaje]\r
Push:   origin/main ✓\r
Deploy: [URL o "no aplica"]\r
Repositorio sincronizado con GitHub.\r
La misión quedó registrada.\r
══════════════════════════════════════════\r
```\r
